[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-task-protocol-runtime"
version = "0.1.0"
description = "Evidence-gated task protocol sidecar for Hermes project work"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Adaptive Task Protocol Runtime contributors"}]
dependencies = []

[project.scripts]
adaptive-runtime = "adaptive_runtime.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_runtime = ["schemas/*.json"]

